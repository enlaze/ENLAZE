name: Centinela E5 de privilegios anon

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anon-privileges-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANON_PRIVILEGES_CHECK_TOKEN: ${{ secrets.ANON_PRIVILEGES_CHECK_TOKEN }}
    steps:
      - name: Exigir el secreto dedicado
        shell: bash
        run: |
          if [[ -z "${ANON_PRIVILEGES_CHECK_TOKEN}" ]]; then
            echo 'Falta ANON_PRIVILEGES_CHECK_TOKEN en GitHub Actions.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Consultar el centinela de solo lectura
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const response = await fetch('https://enlaze.vercel.app/api/internal/anon-privileges-check', {
            headers: { Authorization: `Bearer ${process.env.ANON_PRIVILEGES_CHECK_TOKEN}` },
            signal: AbortSignal.timeout(60_000),
          });
          if (!response.ok) throw new Error(`Centinela E5: HTTP ${response.status}`);

          let result;
          try {
            result = await response.json();
          } catch {
            throw new Error('Centinela E5: respuesta no JSON');
          }
          if (typeof result?.verdict !== 'string') {
            throw new Error('Centinela E5: respuesta sin veredicto');
          }

          console.log(result.verdict);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Centinela E5\n\n${result.verdict}\n`);
          if (!result.verdict.startsWith('OK')) process.exitCode = 1;
          NODE
