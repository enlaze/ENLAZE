name: Price bank sync

on:
  schedule:
    - cron: "43 */2 * * *"
  workflow_dispatch:
    inputs:
      provider_ids:
        description: "Provider UUIDs separated by commas, or 'all'"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: price-bank-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRICE_SYNC_URL: https://enlaze.vercel.app/api/pb/sync/run
      PRICE_SYNC_TOKEN: ${{ secrets.PRICE_SYNC_TOKEN }}
    steps:
      - name: Require sync credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PRICE_SYNC_TOKEN}" ]]; then
            echo "PRICE_SYNC_TOKEN is not configured in GitHub Actions." >&2
            exit 1
          fi

      - name: Materialize current prices
        shell: bash
        env:
          MANUAL_PROVIDER_IDS: ${{ inputs.provider_ids }}
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            targets=("all")
          else
            IFS=',' read -r -a targets <<< "${MANUAL_PROVIDER_IDS}"
          fi

          if [[ "${#targets[@]}" -eq 0 ]]; then
            echo "No provider targets were supplied." >&2
            exit 1
          fi

          target_index=0
          for raw_target in "${targets[@]}"; do
            target="${raw_target//[[:space:]]/}"
            if [[ "${target}" != "all" && ! "${target}" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              echo "Invalid provider target: ${target}" >&2
              exit 1
            fi

            target_index=$((target_index + 1))
            payload_file="${tmp_dir}/payload-${target_index}.json"
            response_file="${tmp_dir}/response-${target_index}.json"

            # Catch-up window: ingestion has been stopped since 2026-08-22.
            # Lower staleness_days again once n8n is ingesting fresh observations.
            if [[ "${target}" == "all" ]]; then
              printf '{"scope":"all","staleness_days":60,"idempotency_key":"sync-%s-%s-all"}' \
                "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > "${payload_file}"
            else
              printf '{"scope":"provider","scope_id":"%s","staleness_days":60,"idempotency_key":"sync-%s-%s-%s"}' \
                "${target}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${target}" > "${payload_file}"
            fi

            http_code="$(curl \
              --silent \
              --show-error \
              --max-time 360 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${PRICE_SYNC_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary "@${payload_file}" \
              "${PRICE_SYNC_URL}")"

            RESPONSE_FILE="${response_file}" HTTP_CODE="${http_code}" TARGET="${target}" node <<'NODE'
          const fs = require("node:fs");
          const path = process.env.RESPONSE_FILE;
          const httpCode = Number(process.env.HTTP_CODE);
          const raw = fs.readFileSync(path, "utf8");
          let result;
          try {
            result = JSON.parse(raw);
          } catch {
            throw new Error(`Price sync returned HTTP ${httpCode} with a non-JSON body`);
          }

          const errors = Array.isArray(result.errors)
            ? result.errors
            : result.error
              ? [result.error]
              : [];
          if (httpCode < 200 || httpCode >= 300) {
            throw new Error(`Price sync returned HTTP ${httpCode}: ${errors.join("; ") || "unknown error"}`);
          }
          if (result.status !== "completed" || result.records_errors !== 0 || errors.length !== 0) {
            throw new Error(
              `Price sync did not complete cleanly: status=${result.status}, records_errors=${result.records_errors}, errors=${errors.length}`,
            );
          }

          console.log(JSON.stringify({
            target: process.env.TARGET,
            run_id: result.run_id,
            status: result.status,
            records_checked: result.records_checked,
            records_new: result.records_new,
            records_modified: result.records_modified,
            records_unchanged: result.records_unchanged,
            records_skipped: result.records_skipped,
            stale_marked: result.stale_marked,
            duration_ms: result.duration_ms,
          }));
          NODE
          done
