name: Service clients without credentials

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/service-clients.ts"
      - "lib/notification-service.ts"
      - "app/api/signatures/send-otp/route.ts"
      - "app/api/agent/budgets/generate/route.ts"
      - "app/api/agent/market/analysis/route.ts"
      - "app/api/invoices/ocr/route.ts"
      - "app/api/generate-budget/route.ts"
      - "__tests__/service-clients-import.test.mjs"
      - "__tests__/support/service-clients-import-probe.mjs"
      - "__tests__/support/build-*"
      - "scripts/test-service-client-mutations.mjs"
      - "scripts/test-build-without-service-keys.mts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service-clients-without-keys.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  without-service-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies without installation scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Import each module without credentials and reject all six eager mutations
        run: npm run test:service-client-mutations
      - name: Full build without email or AI credentials, with local read-only plan fixture
        run: npm run test:build-without-service-keys
      - name: Save test and build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-clients-without-keys
          path: informes/evidencias/lazy-service-clients/
