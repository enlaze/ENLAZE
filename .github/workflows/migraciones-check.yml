name: Migraciones repo vs base

# Compara supabase/migrations con las migraciones registradas en cada proyecto y
# falla si no coinciden, nombrando cuáles faltan en cada lado.
#
# Son DOS proyectos: producción y el de las previsualizaciones. El segundo se
# desincroniza en cuanto se aplica una migración a producción y se olvida
# aplicarla allí, y una base de pruebas que no reproduce el esquema real no
# sirve para probar nada. Por eso se vigilan los dos con el mismo cron.
#
# El disparo programado es el que importa: una migración aplicada a mano desde
# el panel o con `db push` desde otra máquina no cambia el repo, así que ningún
# push la detectaría. El push a main detecta el caso contrario: una migración
# fusionada que nadie ha aplicado todavía (fallo esperado hasta aplicarla).
#
# Solo lee: usa la Management API con el secreto SUPABASE_ACCESS_TOKEN y no
# ejecuta nada contra la base. Sin el secreto, el job falla diciendo que falta.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migraciones-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Sin fail-fast: si uno de los dos se desincroniza, interesa ver el estado
      # del otro igualmente, no quedarse a medias.
      fail-fast: false
      matrix:
        proyecto:
          - nombre: produccion
            ref: dsgnymebkxxkslyeotee
          - nombre: preview
            ref: wowzjvlyklooqafgzuqk
    name: ${{ matrix.proyecto.nombre }}
    env:
      SUPABASE_PROJECT_REF: ${{ matrix.proyecto.ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Comparar migraciones
        run: |
          set -o pipefail
          npm run --silent migraciones:check 2>&1 | tee resultado.txt
      - name: Resumen
        if: always()
        run: |
          {
            echo '### Migraciones repo vs base · ${{ matrix.proyecto.nombre }} (${{ matrix.proyecto.ref }})'
            echo '```'
            cat resultado.txt 2>/dev/null || echo 'Sin salida: el paso anterior no llegó a ejecutarse.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
